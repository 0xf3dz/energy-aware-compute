[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "offgrid-inference"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "psycopg[binary,pool]>=3.2,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
offgrid-inference = "api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api = ["static/*"]
db = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PERF", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# Test doubles use asserts and literal tokens.
"tests/**" = ["S101", "S105", "S106"]
# Every statement is built from module-level column constants and passes each
# value as a query parameter.
"src/db/repository.py" = ["S608"]
