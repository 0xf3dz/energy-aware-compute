name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: compute
          POSTGRES_PASSWORD: compute
          POSTGRES_DB: compute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compute"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://compute:compute@127.0.0.1:5432/compute
      TEST_DATABASE_URL: postgresql://compute:compute@127.0.0.1:5432/compute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Migrations
        run: python -m db.migrate
      - name: Migrations are idempotent
        run: python -m db.migrate
      - name: Tests
        run: pytest -q
      - name: Offline scheduler demonstration
        run: python -m api.cli smoke
